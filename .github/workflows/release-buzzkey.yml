name: buzzkey release

on:
  push:
    tags: ["buzzkey-*"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $Version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($Version -notmatch '\+bk\.\d+$') { throw "pyproject version $Version has no +bk.N suffix" }
          "version=$Version" >> $env:GITHUB_OUTPUT

      - name: Check tag and branch
        shell: pwsh
        run: |
          $Expected = "buzzkey-" + "${{ steps.version.outputs.version }}".Replace("+", "-")
          if ("${{ github.ref_name }}" -ne $Expected) { throw "Tag ${{ github.ref_name }} does not match $Expected" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tagged commit is not on main" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Unit tests
        run: |
          python -m pip install --quiet -e . pytest packaging
          python -m pytest -q tests

      - name: Install Python build tools
        run: python -m pip install --quiet build setuptools wheel

      - name: Fetch verified pyapp source
        shell: pwsh
        run: |
          ./pyapp-build/fetch-pyapp-source.ps1 -Destination pyapp-source
          Copy-Item pyapp-build/Cargo.lock pyapp-source/Cargo.lock -Force
          @{ pyapp_source_path = "pyapp-source"; dist_path = "dist" } | ConvertTo-Json | Set-Content pyapp-build/build-config.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pyapp-source

      - name: Build executables
        shell: pwsh
        run: |
          ./pyapp-build/build-pyapp.ps1 -FromSource -Release -AppName buzzkey
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item dist/buzzkey.exe, dist/buzzkey-console.exe, dist/wheel/*.whl release/
          $Sums = Get-ChildItem release | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $Sums | Set-Content release/SHA256SUMS.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: buzzkey-${{ steps.version.outputs.version }}
          path: release/

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: buzzkey-${{ needs.build-windows.outputs.version }}
          path: release

      - name: Extract release notes
        run: |
          awk -v v="${{ needs.build-windows.outputs.version }}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG-buzzkey.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG-buzzkey.md section for ${{ needs.build-windows.outputs.version }}"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          name: buzzkey ${{ needs.build-windows.outputs.version }}
          body_path: release-notes.md
          files: release/*
